# Elyon-Sol deploy packaging (C1 / VL-081): gate / reference target / publisher
# as networked services. UNVALIDATED in the build sandbox (no docker); stand-up
# is the author's. Plain HTTP here (the loopback/dev model); real TLS + certs are
# C2 (see deploy/runbook.md). Secrets (gate key, pinned anchor) come from .env,
# generated by deploy/bootstrap_config.py and never committed.
#
# Run (single box):  cd deploy && python bootstrap_config.py && docker compose up --build
services:
  publisher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "IMPLEMENTATION.publisher:app", "--host", "0.0.0.0", "--port", "9100"]
    environment:
      ELYON_PUBLISHED_RECORD: /app/EVIDENCE/published_hashes.json
    ports:
      - "9100:9100"

  target:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "IMPLEMENTATION.reference_target:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      # The identity envelopes bind to and the gate admits against (must match
      # the client's admit target_url and the gate's forward URL).
      ELYON_TARGET_URL: http://target:9000/target
      ELYON_PUBLISHER_URL: http://publisher:9100/published_hashes.json
      # Out-of-band trust material from .env (generated by bootstrap_config.py).
      ELYON_PINNED_ROOT_SHA256: ${ELYON_PINNED_ROOT_SHA256}
      ELYON_GATE_KEY_ID: ${ELYON_GATE_KEY_ID}
      ELYON_GATE_PUBLIC_KEY_HEX: ${ELYON_GATE_PUBLIC_KEY_HEX}
    depends_on:
      - publisher
    ports:
      - "9000:9000"

  gate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "IMPLEMENTATION.pep:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ELYON_SIGNING_KEY_HEX: ${ELYON_SIGNING_KEY_HEX}
      ELYON_SIGNING_KEY_ID: ${ELYON_SIGNING_KEY_ID}
      ELYON_DECISION_MAX_AGE_SECONDS: "300"
    depends_on:
      - target
    ports:
      - "8000:8000"
