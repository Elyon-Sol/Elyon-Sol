# Elyon-Sol ext-authz sidecar overlay (OPA sidecar build, step 3 / Mode A).
#
# Adds the `elyon-authz` admissibility sidecar, an Envoy front proxy with the
# Mode A two-filter chain (elyon-authz FIRST, OPA second), an OPA-Envoy plugin,
# and a plain upstream the proxy fronts. Compose to the base file:
#
#   cd deploy && python bootstrap_config.py \
#     && docker compose -f docker-compose.yml -f docker-compose.authz.yml up --build
#
# Run 2026-09-27: all seven containers up; the sidecar ALLOWs a fresh valid token
# and DENYs forged / replayed / rebound ones; `envoy --mode validate` passes on
# envoy.example.yaml. The request path THROUGH Envoy (:10000) was not exercised. The sidecar image is the existing
# deploy/Dockerfile with a command override to the new entrypoint - no new image.
#
# Trust material (gate public-key pin, the published-record anchor) arrives by
# environment from the out-of-band .env (deploy/bootstrap_config.py); nothing is
# baked into the image. failure_mode_allow is FALSE in envoy.example.yaml: a
# sidecar that is down or errors DENIES, never opens.
#
# Images are pinned by DIGEST (VL-154 open item, 2026-10-08). `v1.31-latest` and
# `latest-envoy` floated: a registry push could change Envoy or OPA under a stack
# whose own record is hash-pinned - and Envoy already warns that a field this
# example uses (ext_authz `allowed_headers`) is deprecated and will be removed.
# To refresh a pin: docker pull <repo>:<exact tag>, then
#   docker image inspect <repo>:<exact tag> --format '{{index .RepoDigests 0}}'
# and re-run `envoy --mode validate -c envoy.example.yaml` in the new image.
#
# Published ports (VL-154 open item, 2026-10-08): only Envoy's listener (:10000)
# is the public surface. The sidecar's decision endpoint (:9200) is bound to the
# host's LOOPBACK only - the walkthrough's `localhost:9200` keeps working, but
# nothing on the LAN can ask the sidecar for ALLOW/DENY directly or probe its
# refusal codes. Override the bind address for a cross-host test
# (ELYON_AUTHZ_BIND=0.0.0.0, see deploy/elyon-authz/VM_TLS_TEST.md). OPA's
# ext-authz gRPC port (:9191) is NOT published at all: Envoy reaches it on the
# compose network, and nobody on the host needs it.
services:
  elyon-authz:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "IMPLEMENTATION.authz_sidecar:app", "--host", "0.0.0.0", "--port", "9200"]
    environment:
      # The target identity envelopes bind to (must equal the admit target_url).
      ELYON_TARGET_URL: http://target:9000/target
      # The published record (mounted in the image) + its out-of-band anchor.
      ELYON_RECORD_PATH: /app/EVIDENCE/published_hashes.json
      ELYON_PINNED_ROOT_SHA256: ${ELYON_PINNED_ROOT_SHA256}
      # The pinned gate signing public key (out-of-band, from .env).
      ELYON_GATE_KEY_ID: ${ELYON_GATE_KEY_ID}
      ELYON_GATE_PUBLIC_KEY_HEX: ${ELYON_GATE_PUBLIC_KEY_HEX}
      # Optional: a shared Redis for cross-instance exactly-once replay defense.
      # ELYON_REPLAY_REDIS_URL: redis://redis:6379/0
      # Requests Envoy forwards (/authz/<path>) are never decided from the
      # client-controllable X-Elyon-Sol-Interaction header: they are DENIED
      # (REF_TARGET_NOT_CONFIGURED) until the body-binding mapping is declared.
      # The direct decision endpoint (POST :9200/authz) is unaffected. To admit
      # traffic through Envoy (:10000), declare it:
      # ELYON_EXT_AUTHZ_INLINE: "1"
      # ELYON_INLINE_AP / _OP / _MANIFEST_VERSION / _MANIFEST_SHA256: the route's pins
      # ELYON_INLINE_TOOL: path            # binds the forwarded path + query
      # ELYON_INLINE_ARGS_FIELD: ""         # optional: digest body[field]
    ports:
      # loopback only by default; ELYON_AUTHZ_BIND=0.0.0.0 publishes it on the LAN
      - "${ELYON_AUTHZ_BIND:-127.0.0.1}:9200:9200"

  envoy:
    # Pinned by digest (2026-10-08): Envoy 1.31.10. `v1.31-latest` resolved to this
    # same digest on that date; the tag is now a label, the digest is what pulls.
    image: envoyproxy/envoy:v1.31.10@sha256:caa5b411be1633b90023592a34a7e010c933d6e60206c758f631485e53006865
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./envoy.example.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - elyon-authz
      - opa
      - upstream
    ports:
      - "10000:10000"   # the public listener clients hit

  opa:
    # Pinned by digest (2026-10-08): OPA 1.21.0 (envoy plugin build, commit b84c68c).
    image: openpolicyagent/opa:1.21.0-envoy@sha256:8525be248fbadd6728f0fac46ac07cdfe051d736d64f558c83f5de960338b315
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--diagnostic-addr=0.0.0.0:8282"
      - "--set=plugins.envoy_ext_authz_grpc.addr=:9191"
      - "--set=plugins.envoy_ext_authz_grpc.path=elyon/authz/allow"
      - "--set=decision_logs.console=true"
      - "/policy/policy.rego"
    volumes:
      - ./opa-policy.example.rego:/policy/policy.rego:ro
    # No published ports: Envoy's opa_ext_authz cluster reaches opa:9191 on the
    # compose network. The REST (:8181) and diagnostic (:8282) listeners are
    # likewise internal.

  upstream:
    # The service the proxy fronts. Reuses the reference target image only as a
    # stand-in "acts" endpoint for the example; in a real deployment this is the
    # customer's app. It does NOT enforce admissibility itself here - the sidecar
    # does, upstream of OPA.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "IMPLEMENTATION.reference_target:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      ELYON_TARGET_URL: http://target:9000/target
      ELYON_PUBLISHER_URL: http://publisher:9100/published_hashes.json
      ELYON_PINNED_ROOT_SHA256: ${ELYON_PINNED_ROOT_SHA256}
      ELYON_GATE_KEY_ID: ${ELYON_GATE_KEY_ID}
      ELYON_GATE_PUBLIC_KEY_HEX: ${ELYON_GATE_PUBLIC_KEY_HEX}
