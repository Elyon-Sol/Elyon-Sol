# Elyon-Sol ext-authz sidecar overlay (OPA sidecar build, step 3 / Mode A).
#
# Adds the `elyon-authz` admissibility sidecar, an Envoy front proxy with the
# Mode A two-filter chain (elyon-authz FIRST, OPA second), an OPA-Envoy plugin,
# and a plain upstream the proxy fronts. Compose to the base file:
#
#   cd deploy && python bootstrap_config.py \
#     && docker compose -f docker-compose.yml -f docker-compose.authz.yml up --build
#
# UNVALIDATED in the build sandbox (no docker / no envoy binary); the container
# stand-up + `envoy --mode validate -c envoy.example.yaml` is the author's, the
# same locus as C1/C2 (artifact 13). The sidecar image is the existing
# deploy/Dockerfile with a command override to the new entrypoint - no new image.
#
# Trust material (gate public-key pin, the published-record anchor) arrives by
# environment from the out-of-band .env (deploy/bootstrap_config.py); nothing is
# baked into the image. failure_mode_allow is FALSE in envoy.example.yaml: a
# sidecar that is down or errors DENIES, never opens.
services:
  elyon-authz:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "IMPLEMENTATION.authz_sidecar:app", "--host", "0.0.0.0", "--port", "9200"]
    environment:
      # The target identity envelopes bind to (must equal the admit target_url).
      ELYON_TARGET_URL: http://target:9000/target
      # The published record (mounted in the image) + its out-of-band anchor.
      ELYON_RECORD_PATH: /app/EVIDENCE/published_hashes.json
      ELYON_PINNED_ROOT_SHA256: ${ELYON_PINNED_ROOT_SHA256}
      # The pinned gate signing public key (out-of-band, from .env).
      ELYON_GATE_KEY_ID: ${ELYON_GATE_KEY_ID}
      ELYON_GATE_PUBLIC_KEY_HEX: ${ELYON_GATE_PUBLIC_KEY_HEX}
      # Optional: a shared Redis for cross-instance exactly-once replay defense.
      # ELYON_REPLAY_REDIS_URL: redis://redis:6379/0
    ports:
      - "9200:9200"

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./envoy.example.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - elyon-authz
      - opa
      - upstream
    ports:
      - "10000:10000"   # the public listener clients hit

  opa:
    image: openpolicyagent/opa:latest-envoy
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--diagnostic-addr=0.0.0.0:8282"
      - "--set=plugins.envoy_ext_authz_grpc.addr=:9191"
      - "--set=plugins.envoy_ext_authz_grpc.path=elyon/authz/allow"
      - "--set=decision_logs.console=true"
      - "/policy/policy.rego"
    volumes:
      - ./opa-policy.example.rego:/policy/policy.rego:ro
    ports:
      - "9191:9191"

  upstream:
    # The service the proxy fronts. Reuses the reference target image only as a
    # stand-in "acts" endpoint for the example; in a real deployment this is the
    # customer's app. It does NOT enforce admissibility itself here - the sidecar
    # does, upstream of OPA.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "IMPLEMENTATION.reference_target:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      ELYON_TARGET_URL: http://target:9000/target
      ELYON_PUBLISHER_URL: http://publisher:9100/published_hashes.json
      ELYON_PINNED_ROOT_SHA256: ${ELYON_PINNED_ROOT_SHA256}
      ELYON_GATE_KEY_ID: ${ELYON_GATE_KEY_ID}
      ELYON_GATE_PUBLIC_KEY_HEX: ${ELYON_GATE_PUBLIC_KEY_HEX}
