# Cross-instance replay overlay (B3 / VL-094): adds Redis + a SECOND target instance (:9001)
# sharing it, so a decision_id honored on one instance is refused REF_VERIFY_REPLAY on the other.
# Use WITH the base + tls overlays:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml \
#       -f docker-compose.replay.yml up -d --build redis target target2
# target2 shares target's identity (https://target:9000/target) so an envelope bound
# to it is presentable at either instance; only the shared claim store differs.
# target2 runs in byte-anchor mode (no publisher key) - the replay defense is the same in either
# record mode; both fetch a valid record and the only cross-instance difference is the shared claim.
services:
  redis:
    # Pinned by digest (2026-10-08): Redis 7.4.11 on Alpine.
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499

  target:
    environment:
      ELYON_REPLAY_REDIS_URL: redis://redis:6379/0

  target2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uvicorn", "IMPLEMENTATION.reference_target:app", "--host", "0.0.0.0", "--port", "9001",
              "--ssl-certfile", "/certs/target.crt", "--ssl-keyfile", "/certs/target.key"]
    environment:
      ELYON_TARGET_URL: https://target:9000/target
      ELYON_PUBLISHER_URL: https://publisher:9100/published_hashes.json
      ELYON_PINNED_ROOT_SHA256: ${ELYON_PINNED_ROOT_SHA256}
      ELYON_GATE_KEY_ID: ${ELYON_GATE_KEY_ID}
      ELYON_GATE_PUBLIC_KEY_HEX: ${ELYON_GATE_PUBLIC_KEY_HEX}
      ELYON_TLS_CA_BUNDLE: /certs/ca.crt
      ELYON_REPLAY_REDIS_URL: redis://redis:6379/0
    depends_on:
      - publisher
      - redis
    volumes:
      - ./tls/certs:/certs:ro
    ports:
      - "9001:9001"
